<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محرر النصوص</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📝 محرر النصوص</h1>
    <div class="status">
      <span id="wordCount">كلمات: 0</span>
      <span id="charCount">أحرف: 0</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="group">
      <button data-cmd="undo" title="تراجع">↶</button>
      <button data-cmd="redo" title="إعادة">↷</button>
    </div>

    <div class="group">
      <select id="fontFamily">
        <option value="Tahoma, sans-serif">خط افتراضي</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="'Times New Roman', serif">Times</option>
        <option value="'Courier New', monospace">Courier</option>
      </select>
      <select id="fontSize">
        <option value="1">صغير</option>
        <option value="3" selected>عادي</option>
        <option value="5">كبير</option>
        <option value="7">ضخم</option>
      </select>
    </div>

    <div class="group">
      <button data-cmd="bold"><b>B</b></button>
      <button data-cmd="italic"><i>I</i></button>
      <button data-cmd="underline"><u>U</u></button>
      <button data-cmd="strikeThrough"><s>S</s></button>
    </div>

    <div class="group">
      <button data-cmd="justifyRight" title="يمين">⇥</button>
      <button data-cmd="justifyCenter" title="وسط">⇔</button>
      <button data-cmd="justifyLeft" title="يسار">⇤</button>
      <button data-cmd="justifyFull" title="ضبط">☰</button>
    </div>

    <div class="group">
      <button data-cmd="insertUnorderedList">•≡</button>
      <button data-cmd="insertOrderedList">1≡</button>
    </div>

    <div class="group">
      <input type="color" id="textColor" value="#000000" title="لون النص">
      <input type="color" id="bgColor" value="#ffff00" title="لون التمييز">
      <button data-cmd="removeFormat" title="مسح التنسيق">✕</button>
    </div>

    <div class="group">
      <button id="btnNew">جديد</button>
      <button id="btnSave">حفظ</button>
      <button id="btnLoad">فتح</button>
      <button id="btnDownload">تنزيل</button>
      <button id="btnPrint">طباعة</button>
    </div>
  </div>

  <div id="editor" contenteditable="true" dir="auto"></div>

  <script src="script.js"></script>
</body>
</html>
